<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>결제</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:#0E1726}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F6F4; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #0E1726">
  <div style="background: #FFFFFF">
    <div style="height: 56px; display: flex; align-items: center; padding: 0 4px">
      <a href="Schedule.dc.html" aria-label="뒤로" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
      <span style="flex: 1; text-align: center; font-size: 16px; font-weight: 600; margin-right: 48px">4 / 4 · 결제</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 0 16px 16px">
      <div style="height: 3px; border-radius: 2px; background: #0B7A75"></div><div style="height: 3px; border-radius: 2px; background: #0B7A75"></div><div style="height: 3px; border-radius: 2px; background: #0B7A75"></div><div style="height: 3px; border-radius: 2px; background: #0B7A75"></div>
    </div>
  </div>

  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="background: #FFFFFF; border-radius: 20px; padding: 18px; display: flex; gap: 14px; align-items: center">
      <span style="width: 48px; height: 48px; flex: none; border-radius: 16px; background: #E9F6F4; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#08615D" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18v3a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z"/><path d="M6 12V6.5a2.5 2.5 0 0 1 4.6-1.4"/><path d="m7 20-1 2M17 20l1 2"/></svg></span>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <strong style="font-size: 16px">화장실 청소 · 2개</strong>
        <span style="font-size: 13px; color: #3A4556">11월 13일 (금) 오전 9시 도착 · 약 2시간</span>
        <span style="font-size: 13px; color: #5D6878">우리집 · 24평</span>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 6px 18px">
      <button onClick="{{toggleCoupon}}" style="width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; border: 0; background: transparent; padding: 0; font-family: inherit; text-align: left; color: #0E1726; cursor: pointer; border-bottom: 1px solid #E9EBEE">
        <span style="font-size: 15px; font-weight: 600; width: 72px">쿠폰</span>
        <span style="flex: 1; font-size: 14px; color: {{couponColor}}">{{couponText}}</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5D6878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <div style="min-height: 60px; display: flex; align-items: center; gap: 12px">
        <span style="font-size: 15px; font-weight: 600; width: 72px">결제수단</span>
        <div role="radiogroup" aria-label="결제수단" style="flex: 1; display: flex; gap: 6px">
          <sc-for list="{{methods}}" as="m" hint-placeholder-count="3">
            <button role="radio" aria-checked="{{m.selected}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; font-size: 14px; color: #3A4556"><span>서비스 금액</span><span style="font-variant-numeric: tabular-nums">52,000원</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; color: #3A4556"><span>쿠폰 할인</span><span style="font-variant-numeric: tabular-nums; color: {{discountColor}}">{{discountText}}</span></div>
      <div style="height: 1px; background: #E9EBEE; margin: 4px 0"></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline"><strong style="font-size: 16px">결제 금액</strong><strong style="font-size: 22px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{totalText}}</strong></div>
      <span style="font-size: 12px; color: #5D6878">부가세 포함</span>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
      <strong style="font-size: 15px">방문 전에 준비해 주세요</strong>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <span style="font-size: 13px; padding: 6px 10px; border-radius: 8px; background: #F5F6F4; color: #3A4556">청소기</span>
        <span style="font-size: 13px; padding: 6px 10px; border-radius: 8px; background: #F5F6F4; color: #3A4556">쓰레기봉투</span>
        <span style="font-size: 13px; padding: 6px 10px; border-radius: 8px; background: #F5F6F4; color: #3A4556">막대걸레</span>
        <span style="font-size: 13px; padding: 6px 10px; border-radius: 8px; background: #F5F6F4; color: #3A4556">손걸레</span>
        <span style="font-size: 13px; padding: 6px 10px; border-radius: 8px; background: #F5F6F4; color: #3A4556">고무장갑</span>
        <span style="font-size: 13px; padding: 6px 10px; border-radius: 8px; background: #F5F6F4; color: #3A4556">수세미</span>
        <span style="font-size: 13px; padding: 6px 10px; border-radius: 8px; background: #F5F6F4; color: #3A4556">다목적세제</span>
      </div>
      <span style="font-size: 12px; color: #5D6878">예약 상세에서 체크리스트로 다시 확인할 수 있어요</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; box-shadow: 0 -1px 0 #E9EBEE; padding: 12px 16px 26px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 12px; color: #5D6878; text-align: center">11월 11일 (수)까지 무료 취소 · 이후 취소 수수료 [정책 확정 필요]</span>
    <a href="Booking.dc.html" style="height: 56px; border-radius: 16px; background: #0B7A75; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">{{totalText}} 결제하기</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { coupon: true, method: 0 }; }
  renderVals() {
    const price = 52000, off = this.state.coupon ? 5000 : 0;
    const won = (n) => n.toLocaleString('ko-KR') + '원';
    const labels = ['신한 •• 12', '토스페이', '카카오페이'];
    return {
      toggleCoupon: () => this.setState({ coupon: !this.state.coupon }),
      couponText: this.state.coupon ? '전 서비스 5,000원 적용됨' : '사용 가능 1장',
      couponColor: this.state.coupon ? '#08615D' : '#3A4556',
      discountText: off ? '−' + won(off) : '0원',
      discountColor: off ? '#08615D' : '#3A4556',
      totalText: won(price - off),
      methods: labels.map((label, i) => ({
        label, selected: i === this.state.method,
        pick: () => this.setState({ method: i }),
        style: 'height: 40px; padding: 0 10px; border-radius: 10px; font: 600 13px "IBM Plex Sans KR", sans-serif; white-space: nowrap; cursor: pointer; ' +
          (i === this.state.method ? 'border: 2px solid #0B7A75; background: #E9F6F4; color: #08615D' : 'border: 1px solid #E3E6EA; background: #FFFFFF; color: #0E1726')
      }))
    };
  }
}
</script>
</body>
</html>
