<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>예약 상세</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:#0E1726}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F6F4; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #0E1726">
  <div style="height: 56px; display: flex; align-items: center; padding: 0 4px; background: #FFFFFF">
    <a href="Home.dc.html" aria-label="닫기" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
    <span style="flex: 1; text-align: center; font-size: 16px; font-weight: 600">예약 상세</span>
    <a href="Chat.dc.html" aria-label="상담하기" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></a>
  </div>

  <div style="padding: 0 16px 20px; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
    <span style="align-self: flex-start; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #E9F6F4; color: #08615D">팀 배정 완료</span>
    <h1 style="margin: 6px 0 0; font-size: 22px; line-height: 30px; font-weight: 700; letter-spacing: -0.02em">11월 13일 (금) 오전 9시</h1>
    <span style="font-size: 14px; color: #3A4556">화장실 청소 · 2개 · 약 2시간</span>
  </div>

  <div style="padding: 10px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <ol aria-label="진행 상황" style="list-style: none; margin: 0; background: #FFFFFF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 0">
      <li style="display: flex; gap: 14px">
        <div style="display: flex; flex-direction: column; align-items: center"><span style="width: 22px; height: 22px; border-radius: 50%; background: #0B7A75; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg></span><span style="width: 2px; flex: 1; min-height: 14px; background: #0B7A75"></span></div>
        <div style="padding-bottom: 12px; display: flex; flex: 1; justify-content: space-between"><span style="font-size: 14px; font-weight: 600">결제 · 예약 확정</span><span style="font-size: 12px; color: #5D6878">11.10 11:42</span></div>
      </li>
      <li style="display: flex; gap: 14px">
        <div style="display: flex; flex-direction: column; align-items: center"><span style="width: 22px; height: 22px; border-radius: 50%; background: #0B7A75; box-shadow: 0 0 0 5px #CDEBE7; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg></span><span style="width: 2px; flex: 1; min-height: 14px; background: #E3E6EA"></span></div>
        <div style="padding-bottom: 12px; display: flex; flex-direction: column; gap: 2px; flex: 1">
          <div style="display: flex; justify-content: space-between"><span style="font-size: 14px; font-weight: 700">청소팀 배정</span><span style="font-size: 12px; color: #5D6878">11.10 15:20</span></div>
          <span style="font-size: 13px; color: #3A4556">클린팀 한빛이 방문해요</span>
        </div>
      </li>
      <li style="display: flex; gap: 14px">
        <div style="display: flex; flex-direction: column; align-items: center"><span style="width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px #D5D9DF; background: #FFFFFF"></span></div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
          <span style="font-size: 14px; font-weight: 600; color: #5D6878">청소 완료</span>
          <span style="font-size: 13px; color: #5D6878">끝나면 전후 사진이 여기에 올라와요</span>
        </div>
      </li>
    </ol>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <strong style="font-size: 15px">준비물 체크</strong>
        <span style="font-size: 13px; font-weight: 600; color: {{progressColor}}">{{progressText}}</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{tools}}" as="t" hint-placeholder-count="7">
          <label style="{{t.style}}">
            <input type="checkbox" checked="{{t.done}}" onChange="{{t.toggle}}" style="width: 18px; height: 18px; accent-color: #0B7A75; margin: 0">
            <span>{{t.name}}</span>
          </label>
        </sc-for>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 6px 18px">
      <div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; border-bottom: 1px solid #E9EBEE"><span style="color: #5D6878">주소</span><span>우리집 · 24평</span></div>
      <div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; font-size: 14px"><span style="color: #5D6878">결제</span><span style="font-variant-numeric: tabular-nums">47,000원 · 신한 •• 12</span></div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; box-shadow: 0 -1px 0 #E9EBEE; padding: 12px 16px 26px; display: flex; gap: 8px">
    <button style="flex: 1; height: 52px; border: 1px solid #D5D9DF; border-radius: 16px; background: #FFFFFF; font: 600 15px 'IBM Plex Sans KR', sans-serif; color: #0E1726">예약 취소</button>
    <a href="Chat.dc.html" style="flex: 2; height: 52px; border-radius: 16px; background: #E9F6F4; color: #08615D; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">상담팀에 문의하기</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { done: [true, true, false, true, false, false, false] }; }
  renderVals() {
    const names = ['청소기', '쓰레기봉투', '막대걸레', '손걸레', '고무장갑', '수세미', '다목적세제'];
    const done = this.state.done;
    const count = done.filter(Boolean).length;
    return {
      progressText: count === names.length ? '모두 준비됐어요' : count + ' / ' + names.length,
      progressColor: count === names.length ? '#08615D' : '#5D6878',
      tools: names.map((name, i) => ({
        name, done: done[i],
        toggle: () => this.setState({ done: done.map((v, k) => (k === i ? !v : v)) }),
        style: 'display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px; border-radius: 10px; font-size: 14px; cursor: pointer; ' +
          (done[i] ? 'background: #E9F6F4; color: #08615D' : 'background: #F5F6F4; color: #0E1726')
      }))
    };
  }
}
</script>
</body>
</html>
