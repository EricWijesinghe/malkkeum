<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>화장실 청소 옵션 선택</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:#0E1726}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #0E1726">
  <div style="height: 56px; display: flex; align-items: center; padding: 0 4px">
    <a href="Home.dc.html" aria-label="뒤로" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
    <span style="flex: 1; text-align: center; font-size: 16px; font-weight: 600; margin-right: 48px">1 / 4 · 옵션</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 0 16px">
    <div style="height: 3px; border-radius: 2px; background: #0B7A75"></div><div style="height: 3px; border-radius: 2px; background: #E9EBEE"></div><div style="height: 3px; border-radius: 2px; background: #E9EBEE"></div><div style="height: 3px; border-radius: 2px; background: #E9EBEE"></div>
  </div>

  <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="height: 128px; border-radius: 20px; background: #E9F6F4; display: flex; align-items: center; justify-content: center; gap: 10px; color: #08615D">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#08615D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18v3a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z"/><path d="M6 12V6.5a2.5 2.5 0 0 1 4.6-1.4"/><path d="m7 20-1 2M17 20l1 2"/></svg>
      <span style="font-size: 12px; font-weight: 600">[실제 작업 사진 자리]</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -0.02em">화장실 청소</h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: #3A4556">선반, 수전, 세면대와 변기의 안팎을 청소하고 바닥 물기를 제거해 마무리합니다.</p>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 10px; font-size: 15px; font-weight: 700">화장실 개수</legend>
      <sc-for list="{{units}}" as="u" hint-placeholder-count="4">
        <label style="{{u.cardStyle}}">
          <input type="radio" name="units" checked="{{u.selected}}" onChange="{{u.pick}}" style="width: 20px; height: 20px; accent-color: #0B7A75; margin: 0">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><strong style="font-size: 16px; font-weight: 600">{{u.label}}</strong><span style="font-size: 13px; color: #5D6878">약 {{u.dur}}</span></span>
          <strong style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums">{{u.priceText}}</strong>
        </label>
      </sc-for>
    </fieldset>

    <details style="border-radius: 14px; background: #F5F6F4; padding: 12px 14px">
      <summary style="font-size: 14px; font-weight: 600; color: #3A4556; min-height: 24px">제공하지 않는 작업 3가지</summary>
      <ul style="margin: 8px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.6; color: #3A4556">
        <li>배수구·변기 막힘이 있으면 서비스가 제한될 수 있어요</li>
        <li>특수 약품이 필요한 청소, 천장·환풍기 청소</li>
        <li>오래된 곰팡이·찌든 때는 완전히 제거되지 않을 수 있어요</li>
      </ul>
    </details>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; box-shadow: 0 -1px 0 #E9EBEE; padding: 14px 16px 26px; display: flex; align-items: center; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 1px; min-width: 120px">
      <span style="font-size: 12px; color: #5D6878">{{selLabel}} · 약 {{selDur}}</span>
      <strong style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{selPrice}}</strong>
    </div>
    <a href="Schedule.dc.html" style="flex: 1; height: 56px; border-radius: 16px; background: #0B7A75; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">날짜 고르기</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 1 }; }
  renderVals() {
    const data = [
      { label: '1개', dur: '2시간', price: 39000 },
      { label: '2개', dur: '2시간', price: 52000 },
      { label: '3개', dur: '3시간', price: 69000 },
      { label: '4개', dur: '4시간', price: 84000 }
    ];
    const won = (n) => n.toLocaleString('ko-KR') + '원';
    const on = 'display: flex; align-items: center; gap: 14px; padding: 0 18px; height: 64px; border-radius: 16px; border: 2px solid #0B7A75; background: #E9F6F4; cursor: pointer';
    const off = 'display: flex; align-items: center; gap: 14px; padding: 0 19px; height: 64px; border-radius: 16px; border: 1px solid #E3E6EA; background: #FFFFFF; cursor: pointer';
    const sel = data[this.state.sel];
    return {
      units: data.map((u, i) => ({
        label: '화장실 ' + u.label, dur: u.dur, priceText: won(u.price),
        selected: i === this.state.sel, cardStyle: i === this.state.sel ? on : off,
        pick: () => this.setState({ sel: i })
      })),
      selLabel: '화장실 ' + sel.label, selDur: sel.dur, selPrice: won(sel.price)
    };
  }
}
</script>
</body>
</html>
