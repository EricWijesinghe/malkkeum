[package]
name = "api"
description = "HTTP + WebSocket API for customer, partner and console apps"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
domain = { path = "../domain" }
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
base64 = "0.22"
chrono.workspace = true
futures-util = "0.3"
hmac = "0.13"
sha1 = "0.10"
data-encoding = "2"
hex = "0.4"
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto", "use_pem"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde.workspace = true
serde_json.workspace = true
log = "0.4"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "2"
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util", "sync", "time", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid.workspace = true

[dev-dependencies]

http-body-util = "0.1"
