# Test-only: deploy/e2e-install.sh copies this to /opt/malkkeum/docker-compose.override.yml so scripts/smoke.py can
# run against the installed stack (dev login codes, fake payments, seeded admin), then puts the normal one back.
# DEV_MODE is refused with a public PUBLIC_BASE_URL (config.rs), so the API is reached on 127.0.0.1:18080 directly.
services:
  db: { mem_limit: 768m }
  web: { mem_limit: 256m }
  api:
    mem_limit: 512m
    ports: ["127.0.0.1:18080:8080"]
    environment:
      DEV_MODE: "1"
      PUBLIC_BASE_URL: http://localhost
      STAFF_MFA_REQUIRED: "0"
      SEED_ADMIN_EMAIL: admin@local.test
      SEED_ADMIN_PASSWORD: change-me-now-please
      RATE_LIMIT_AUTH_PER_MIN: "1000"
