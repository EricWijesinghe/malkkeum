<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>말끔 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--brand:#12B886;--brand-d:#0B8F69;--brand-w:#E7F8F1;--ink:#191F28;--ink2:#333D4B;--sub:#8B95A1;--sub2:#6B7684;--line:#EEF0F3;--bg:#F4F5F7;--navy:#101A36;--red:#F04452;--orange:#FF9F1C;--blue:#3182F6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#DDE1E6;color:var(--ink);display:flex;align-items:center;justify-content:center;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
.device{position:relative;width:390px;height:844px;max-height:100vh;background:#fff;border-radius:36px;overflow:hidden;box-shadow:0 30px 80px rgba(16,26,54,.25)}
@media (max-width:500px){body{background:#fff;display:block}.device{width:100%;height:100vh;height:100dvh;max-height:none;border-radius:0;box-shadow:none}}
#app{height:100%}
.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.screen.gray{background:var(--bg)}
.body{flex:1;overflow-y:auto;overflow-x:hidden}
.body::-webkit-scrollbar,.hs::-webkit-scrollbar,.chips::-webkit-scrollbar,.tabs::-webkit-scrollbar,.qr::-webkit-scrollbar{display:none}
.nav{height:56px;display:flex;align-items:center;padding:0 8px;flex-shrink:0;gap:4px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;position:relative}
.nav-title{flex:1;font-size:17px;font-weight:600}
.nav-title.c{text-align:center}
.nav-title small{display:block;font-size:12px;color:var(--sub);font-weight:500;margin-top:1px}
.nav-link{color:var(--brand-d);font-weight:600;font-size:15px;padding:0 12px;display:flex;align-items:center;gap:4px}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.i.sm{width:18px;height:18px}
svg.i.lg{width:30px;height:30px}
.h1{font-size:26px;font-weight:700;line-height:1.38;padding:8px 24px 0;letter-spacing:-.02em}
.desc{font-size:15px;color:var(--sub2);line-height:1.6;padding:10px 24px 0}
.desc em{font-style:normal;color:var(--brand-d);font-weight:600}
.sec{padding:28px 24px}
.sec-t{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-t .req{font-size:14px;color:var(--red);font-weight:500}
.divider{height:10px;background:var(--bg)}
.hr{height:1px;background:var(--line);margin:0 24px}
.cta{padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;flex-shrink:0;display:flex;gap:10px;align-items:center}
.btn{height:56px;border-radius:14px;background:var(--brand);color:#fff;font-size:17px;font-weight:700;flex:1;text-align:center;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn:disabled{background:#D1D6DB;cursor:not-allowed;transform:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #E5E8EB}
.btn.sm{flex:0 0 150px}
.pricebar{flex:1}
.pricebar b{font-size:21px}
.pricebar small{display:block;color:var(--sub);font-size:13px;text-decoration:underline;margin-top:2px;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;height:48px;padding:0 24px;border:1px solid #E5E8EB;border-radius:24px;font-weight:600;font-size:16px;background:#fff}
.radio{width:26px;height:26px;border-radius:50%;border:2px solid #D1D6DB;flex-shrink:0;transition:border .15s;background:#fff}
.radio.on{border:8px solid var(--brand)}
.chk{width:26px;height:26px;border-radius:50%;background:#D1D6DB;color:#fff;display:grid;place-items:center;flex-shrink:0}
.chk.on{background:var(--brand)}
.chk svg{width:16px;height:16px;stroke-width:2.6}
.opt{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:12px;cursor:pointer;width:100%;text-align:left;background:#fff}
.opt.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.opt .t{font-size:17px;font-weight:600}
.opt .s{font-size:14px;color:var(--sub2);margin-top:4px;line-height:1.5}
.opt .s a{color:var(--brand-d);font-weight:600;text-decoration:underline}
.row{display:flex;align-items:center;gap:14px;padding:16px 0;width:100%;text-align:left;cursor:pointer}
.row .t{flex:1;font-size:16px;line-height:1.45}
.row .chev{color:#C4CAD1}
.cops{display:flex;flex-wrap:wrap;gap:18px 22px}
.cops.nowrap{flex-wrap:nowrap;overflow-x:auto;margin:0 -24px;padding:0 24px}
.cop{display:flex;flex-direction:column;align-items:center;gap:10px;width:72px;flex-shrink:0;cursor:pointer;font-size:14px;color:var(--ink2);text-align:center;line-height:1.35}
.cop .c{width:72px;height:72px;border-radius:50%;background:var(--bg);display:grid;place-items:center;transition:.15s;font-size:22px;font-weight:600}
.cop.on .c{background:var(--brand);color:#fff}
.cop .c svg{width:30px;height:30px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 24px}
.chip{flex-shrink:0;height:40px;padding:0 18px;border-radius:20px;border:1px solid #E5E8EB;font-size:15px;white-space:nowrap;background:#fff}
.chip.on{background:var(--ink2);color:#fff;border-color:var(--ink2)}
.tabs{display:flex;gap:24px;padding:0 24px;border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0}
.tab{height:50px;font-size:17px;font-weight:600;color:#B0B8C1;position:relative;white-space:nowrap;flex-shrink:0}
.tab.on{color:var(--ink)}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--ink);border-radius:2px}
.tabs.eq{gap:0;padding:0}.tabs.eq .tab{flex:1;text-align:center}
.tabs.eq .tab.on{color:var(--brand-d)}.tabs.eq .tab.on::after{background:var(--brand)}
.hs{display:flex;gap:12px;overflow-x:auto;padding:0 24px;scroll-snap-type:x mandatory;scroll-padding:0 24px}
.hs>*{scroll-snap-align:start;flex-shrink:0}
.badge{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:13px;font-weight:700}
.badge.navy{background:var(--navy);color:#fff}
.badge.orange{background:var(--orange);color:#3a2300}
.badge.brand{background:var(--brand-w);color:var(--brand-d)}
.badge.line{border:1px solid #E5E8EB;color:var(--brand-d);background:#fff}
.empty{text-align:center;color:var(--sub);font-size:16px;padding:80px 24px;line-height:1.6}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}
.note{font-size:14px;color:var(--sub2);line-height:1.6;padding-left:18px;position:relative}
.note::before{content:'※';position:absolute;left:0}
.bul{font-size:15px;color:var(--sub2);line-height:1.6;padding:6px 0 6px 14px;position:relative}
.bul::before{content:'';position:absolute;left:2px;top:15px;width:4px;height:4px;border-radius:50%;background:#B0B8C1}
.infobox{background:var(--bg);border-radius:14px;padding:18px 20px;font-size:15px;line-height:1.6;color:var(--ink2);display:flex;align-items:center;gap:12px}
.infobox a{color:var(--brand-d);font-weight:700;text-decoration:underline;cursor:pointer;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;font-size:15px}
.kv span{color:var(--sub2)}
.kv.total{font-size:17px;font-weight:700;border-top:1px solid var(--line);margin-top:8px;padding-top:16px}
.kv.total b{color:var(--brand-d)}
.box{border:1px solid var(--line);border-radius:16px;padding:8px 22px}
/* toast & sheet */
#toast-root .wrap{position:absolute;left:16px;right:16px;z-index:70;pointer-events:none}
.toast{background:rgba(25,31,40,.95);color:#fff;border-radius:14px;padding:16px 18px;font-size:15px;line-height:1.5;display:flex;align-items:center;gap:12px;pointer-events:auto;animation:tin .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast b{color:#63E6BE}
.toast button{color:#63E6BE;font-weight:700;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.sheet-ov{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:50;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;z-index:51;max-height:86%;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:24px 20px 8px 24px}
.sheet-h h3{font-size:20px}
.sheet-b{overflow-y:auto;padding:8px 24px 24px}
.sheet .cta{border-top:0}
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:8px;color:var(--ink2)}
.field input{width:100%;height:52px;border-radius:12px;border:1px solid transparent;background:var(--bg);padding:0 16px;font-size:16px;outline:none}
.field input:focus{border-color:var(--brand);background:#fff}
/* tabbar */
.tabbar{height:64px;border-top:1px solid var(--line);display:flex;background:#fff;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#4E5968;position:relative}
.tabbar button.on{color:var(--ink);font-weight:700}
.tabbar button.on svg{stroke-width:2.3}
.tabbar .cnt{position:absolute;top:6px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
/* home */
.home-h{display:flex;align-items:center;gap:12px;padding:12px 16px 8px 24px}
.logo{font-size:24px;font-weight:800;color:var(--brand);display:flex;align-items:center;gap:4px;letter-spacing:-.04em}
.seg{flex:1;display:flex;justify-content:center}
.seg>div{display:flex;background:var(--bg);border-radius:20px;padding:3px}
.seg button{height:36px;padding:0 16px;border-radius:18px;font-size:15px;font-weight:600;color:#B0B8C1}
.seg button.on{background:var(--ink2);color:#fff}
.dotr{position:absolute;top:9px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 4px;padding:18px 16px 26px}
.tile{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:14px;color:var(--ink2);position:relative;text-align:center}
.tile .ti{width:58px;height:58px;border-radius:18px;display:grid;place-items:center}
.tile .ti svg{width:30px;height:30px;stroke-width:1.8}
.tile .nb{position:absolute;top:-6px;left:calc(50% + 14px);background:var(--red);color:#fff;font-size:11px;font-weight:800;height:20px;min-width:20px;padding:0 6px;border-radius:10px;display:grid;place-items:center}
.reco{display:flex;align-items:center;gap:18px;padding:8px 24px 28px;width:100%}
.reco .av{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,#D3F9E8 30%,#EFFCF6 70%,transparent 72%);display:grid;place-items:center;color:var(--brand-d);flex-shrink:0}
.reco .av svg{width:40px;height:40px}
.reco b{font-size:22px;display:block}
.reco span{color:var(--sub);font-size:15px;display:flex;align-items:center;gap:2px;margin-top:6px}
.banner{height:130px;border-radius:18px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden;text-align:left}
.banner .bt{font-size:18px;font-weight:700;line-height:1.4}
.banner .bs{font-size:14px;color:var(--sub2);margin-top:6px}
.banner .art{width:96px;height:64px;border-radius:10px;transform:rotate(-8deg);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;box-shadow:0 8px 16px rgba(0,0,0,.12);flex-shrink:0}
.bcount{position:absolute;right:32px;bottom:22px;background:#fff;border-radius:14px;height:28px;padding:0 6px 0 12px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.bcount i{width:18px;height:18px;border-radius:50%;background:var(--ink2);color:#fff;display:grid;place-items:center;font-style:normal;font-size:14px;line-height:1}
.card{background:#fff;border-radius:18px;margin:0 16px;padding:8px 20px}
.news{display:flex;gap:16px;align-items:center;padding:12px 0;width:100%;text-align:left}
.news .th{width:84px;height:84px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;font-size:36px}
.news small{color:var(--sub);font-size:14px}
.news p{font-size:16px;line-height:1.45;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.promo{border-radius:16px;padding:20px 22px;color:#fff;background:linear-gradient(120deg,#FF8A3D,#FF6B3D);margin:8px 0;text-align:left;width:100%}
.promo small{opacity:.9;font-size:13px}
.promo b{display:block;font-size:19px;line-height:1.4;margin-top:4px}
.promo u{font-size:13px;opacity:.9;margin-top:10px;display:inline-block}
/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px 24px}
.cal-h .m{font-size:26px;font-weight:700;display:flex;align-items:center;gap:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px;row-gap:2px}
.cal .wd{text-align:center;font-size:13px;color:var(--sub);padding:8px 0}
.cal .d{height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:600;border-radius:12px;margin:0 3px;position:relative;text-align:center}
.cal .d.today{font-size:15px}
.cal .d.out{color:#D1D6DB}
.cal .d:disabled{color:#D9DDE2;cursor:default}
.cal .d.sel{background:var(--ink2);color:#fff}
.cal .d .dot{width:5px;height:5px;border-radius:50%;background:var(--brand);position:absolute;bottom:4px}
.handle{width:56px;height:5px;border-radius:3px;background:#E5E8EB;margin:14px auto}
.bk{display:flex;align-items:center;gap:16px;padding:14px 24px;width:100%;text-align:left}
.bk .ic{width:64px;height:64px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.bk .ic svg{width:30px;height:30px}
.bk b{font-size:20px;display:block}
.bk span{color:var(--sub);font-size:15px}
/* more */
.mgroup{background:#fff;border-radius:20px;margin:0 16px 16px;padding:6px 24px}
.mrow{display:flex;align-items:center;gap:18px;padding:18px 0;width:100%;font-size:17px;text-align:left}
.mrow svg.i{width:28px;height:28px;stroke-width:1.5}
.mrow .t{flex:1}
.mrow .v{color:var(--sub);font-size:16px}
.mrow .chev{color:#C4CAD1}
/* misc */
.hero{margin:22px 24px 0;height:180px;border-radius:18px;display:grid;place-items:center}
.hero .hc{width:110px;height:110px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.hero .hc svg{width:54px;height:54px;stroke-width:1.5}
.rv{width:300px;border-radius:16px;overflow:hidden;background:var(--bg)}
.rv .ba{display:grid;grid-template-columns:1fr 1fr;height:150px}
.rv .ba div{position:relative;display:grid;place-items:center;font-size:40px}
.rv .ba span{position:absolute;left:0;bottom:0;background:var(--ink2);color:#fff;font-size:13px;font-weight:700;padding:6px 10px}
.rv .rb{padding:16px 18px}
.rv .rn{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.rv .rn i{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal}
.rv p{font-size:14px;color:var(--sub2);line-height:1.6;margin-top:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 4px}
.tools div{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
.tools svg{width:34px;height:34px;stroke-width:1.4}
.cnts{display:flex;gap:12px;overflow-x:auto;margin:0 -24px;padding:0 24px}
.cnt-card{flex-shrink:0;min-width:130px;border:1px solid #E5E8EB;border-radius:14px;padding:16px 18px;text-align:left}
.cnt-card b{font-size:18px;display:block;white-space:nowrap}
.cnt-card span{font-size:14px;color:var(--sub);margin-top:4px;display:block}
.cnt-card em{font-style:normal;font-size:14px;font-weight:600;color:var(--ink2);margin-top:8px;display:block}
.cnt-card.on{border:2px solid var(--ink2);background:var(--bg);padding:15px 17px}
.mgr{display:flex;align-items:center;justify-content:space-between;padding:4px 24px 24px}
.mgr p{font-size:16px;line-height:1.6}
.mgr a{color:var(--sub);font-size:15px;display:flex;align-items:center;gap:2px;cursor:pointer}
.mgr .av{width:88px;height:88px;border-radius:50%;background:var(--brand-w);display:grid;place-items:center;color:var(--brand-d)}
.mgr .av svg{width:44px;height:44px;stroke-width:1.5}
.trow{display:flex;align-items:center;justify-content:space-between;padding:18px 24px}
.trow .tl b{font-size:24px;display:block}
.trow .tl b.ph{color:#C4CAD1}
.trow .tl span{font-size:14px;color:var(--sub);margin-top:4px;display:block}
.trow .pill{height:52px;padding:0 26px}
.slot{display:flex;justify-content:space-between;align-items:center;width:100%;padding:18px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;font-size:16px}
.slot.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset;color:var(--brand-d);font-weight:700}
.slot:disabled{color:#C4CAD1;background:var(--bg)}
.done-ic{width:88px;height:88px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;margin:60px auto 24px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.done-ic svg{width:44px;height:44px;stroke-width:2.6}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.stepper{display:flex;justify-content:space-between;position:relative;margin:28px 24px 0}
.stepper::before{content:'';position:absolute;top:9px;left:12%;right:12%;height:2px;background:#E5E8EB}
.stepper .bar{position:absolute;top:9px;left:12%;height:2px;background:var(--brand)}
.stepper div{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;font-size:15px;color:#B0B8C1;font-weight:600}
.stepper i{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #D1D6DB;display:block}
.stepper .on{color:var(--brand-d)}
.stepper .on i{background:var(--brand);border-color:var(--brand)}
.bavatar{width:110px;height:110px;border-radius:50%;background:var(--navy);margin:20px auto;display:grid;place-items:center;color:#63E6BE}
.bavatar svg{width:56px;height:56px;stroke-width:1.4}
.plan{margin:24px auto 0;display:block}
.check-li{display:flex;gap:12px;align-items:center;padding:10px 0;font-size:16px}
.check-li i{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex-shrink:0}
.check-li i svg{width:16px;height:16px;stroke-width:2.6}
.quote{background:#fff;border:2px solid var(--brand);border-radius:18px;padding:24px;margin:28px 20px}
.quote .qh{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:700}
.quote .qp{font-size:26px;font-weight:700;margin-top:6px}
.quote li{list-style:none;display:flex;gap:10px;color:var(--sub2);font-size:15px;padding:5px 0}
.quote li svg{color:var(--brand);width:18px;height:18px;stroke-width:2.4}
.faq{border-bottom:1px solid var(--line)}
.faq button{display:flex;width:100%;padding:20px 0;font-size:16px;font-weight:600;gap:10px;align-items:center;text-align:left}
.faq p{padding:0 0 20px;color:var(--sub2);line-height:1.6;font-size:15px}
/* chat */
.clist{display:flex;align-items:center;gap:14px;padding:16px 24px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.clist .ca{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.clist .ca svg{width:26px;height:26px}
.clist .cm{flex:1;min-width:0}
.clist .cm b{font-size:16px;display:block}
.clist .cm p{font-size:14px;color:var(--sub2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clist .cr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--sub);flex-shrink:0}
.clist .un{background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.msgs{padding:16px 16px 20px;display:flex;flex-direction:column;gap:6px;min-height:100%}
.mrow2{display:flex;align-items:flex-end;gap:6px;max-width:100%}
.mrow2.me{justify-content:flex-end}
.mav{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex-shrink:0;align-self:flex-start}
.mav svg{width:20px;height:20px}
.mname{font-size:13px;color:var(--sub2);margin:0 0 4px 2px}
.msg{max-width:260px;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.me .msg{background:var(--brand);color:#fff;border-bottom-right-radius:6px}
.agent .msg{background:#fff;border-top-left-radius:6px}
.mt{font-size:11px;color:var(--sub);flex-shrink:0;padding-bottom:2px}
.sysmsg{align-self:center;font-size:12px;color:var(--sub);background:rgba(0,0,0,.05);padding:5px 12px;border-radius:12px;margin:10px 0}
.mcard{background:#fff;border-radius:16px;padding:16px 18px;width:260px;border:1px solid var(--line)}
.mcard b{font-size:15px;display:block;margin-bottom:8px}
.mcard .kv{font-size:13px;padding:4px 0}
.mcard button{margin-top:10px;width:100%;height:38px;border-radius:10px;background:var(--bg);font-weight:600;font-size:14px;text-align:center}
.typing{display:inline-flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:#B0B8C1;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.qr{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 0;background:#fff;border-top:1px solid var(--line)}
.qr button{flex-shrink:0;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--brand);color:var(--brand-d);font-size:14px;font-weight:600;background:#fff}
.cin{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff}
.qr+.cin{border-top:0}
.cin input{flex:1;height:44px;border-radius:22px;background:var(--bg);border:0;padding:0 18px;font-size:15px;outline:none}
.cin .send{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex-shrink:0}
.cin .plus{width:40px;height:40px;display:grid;place-items:center;color:var(--sub2)}
</style>
</head>

}

 sheet('방문일 선택',`<div class="cal-h" style="padding:0 0 8px"><button class="ib" onclick="moveD(-1)">${ic('left')}</button><div class="m" style="font-size:20px">${y}년 ${m+1}월</div><button class="ib" onclick="moveD(1)">${ic('chev')}</button></div>${calGrid(y,m,{sel:d.date,isDis,pick:'pickDate'})}<p style="font-size:13px;color:var(--sub);margin-top:12px">내일부터 60일 이내로 선택할 수 있어요.</p>`);

}

function newChat({title,svc=null,bookingId=null,kind='general'}){
 const c={id:'ch'+Date.now()+Math.random().toString(16).slice(2,5),title,svc,bookingId,kind,unread:0,msgs:[],created:Date.now()};
 S.chats.unshift(c);save();return c;
}
const chatOf=id=>S.chats.find(c=>c.id===id);
const viewing=id=>cur()?.screen==='chatroom'&&cur().params.id===id;
function refreshIfSafe(id){if(viewing(id)||!ui.stack.length)render()}
function agentSay(id,text,delay=1400,extra={}){
 setTimeout(()=>{ui.typing[id]=(ui.typing[id]||0)+1;refreshIfSafe(id)},Math.max(0,delay-1100));
 setTimeout(()=>{
  const c=chatOf(id);if(!c)return;ui.typing[id]=Math.max(0,(ui.typing[id]||1)-1);
  c.msgs.push({from:'agent',text,t:Date.now(),...extra});
  if(!viewing(id)){c.unread=(c.unread||0)+1;toast(`<b>${esc(c.title)}</b><br>새 상담 메시지가 도착했어요`,{icon:'💬',action:{label:'보기',fn:`openChat('${id}')`},ms:3500})}
  save();refreshIfSafe(id);
 },delay);
}
function startChat(topic){
 let c=S.chats.find(x=>x.title===topic&&!x.bookingId);
 if(!c){c=newChat({title:topic});c.msgs.push({from:'sys',text:'상담이 시작됐어요',t:Date.now()});save();agentSay(c.id,`안녕하세요, 말끔 상담팀입니다 😊\n${topic} 관련해서 어떤 점이 궁금하신가요? 평수나 원하시는 날짜를 함께 알려주시면 더 빠르게 안내드릴게요.`,1300)}
 closeSheet();openChat(c.id);
}
function openChat(id){const c=chatOf(id);if(!c)return;c.unread=0;save();if(viewing(id)){render();return}go('chatroom',{id})}
function openChatForBooking(bid){const b=S.bookings.find(x=>x.id===bid);let c=b.chatId&&chatOf(b.chatId);
 if(!c){c=newChat({title:svcName(b.svc)+' 문의',svc:b.svc,bookingId:b.id,kind:b.kind});c.msgs.push({from:'sys',text:`${fmtL(b.date)} 예약 건 문의`,t:Date.now()});b.chatId=c.id;save();agentSay(c.id,`안녕하세요, 말끔 상담팀입니다.\n${fmtS(b.date)} ${svcName(b.svc)} 예약 건으로 무엇을 도와드릴까요?`,1200)}

function sendMsg(id,text){
 const inp=document.getElementById('chat-in');text=(text??inp?.value??'').trim();if(!text)return;if(inp)inp.value='';
 const c=chatOf(id);c.msgs.push({from:'me',text,t:Date.now()});save();render();
 agentSay(id,replyFor(c,text),1600+Math.random()*900);
}
function replyFor(c,t){
 const b=c.bookingId&&S.bookings.find(x=>x.id===c.bookingId);
 if(/확정|예약할게|진행해|좋아요|괜찮/.test(t)&&b&&b.status===0){
  setTimeout(()=>{b.status=1;b.paid=true;save();if(!ui.stack.length||viewing(c.id)||cur()?.screen==='bdetail')render()},1700);
  return `예약이 확정됐어요! 🎉\n예약금 ${won(r100(b.price*.1))}은 데모이므로 결제된 것으로 처리했어요. 방문 전날 담당 팀장님 정보를 보내드릴게요.`}
 if(/견적|가격|얼마|비용|금액/.test(t))return b?.price?`현재 예상 견적은 ${won(b.price)}이에요.\n오염도나 짐 상태에 따라 현장에서 ±10% 정도 달라질 수 있고, 변동이 있으면 작업 전에 먼저 말씀드려요.`:'정확한 견적을 위해 평수와 방 구조, 원하시는 날짜를 알려주시겠어요? 사진을 함께 보내주시면 더 정확해요.';
 if(/일정|날짜|변경|시간|언제/.test(t))return '원하시는 날짜와 시간대(오전/오후)를 알려주시면 가능한 팀을 바로 확인해 드릴게요.';
 if(/취소|환불/.test(t))return b&&b.status===0?'아직 예약금 결제 전이라 취소 수수료는 없어요. 예약 상세 화면 하단의 "예약 취소"로 바로 취소하실 수 있어요.':'방문 2일 전까지는 전액 환불, 이후에는 규정에 따라 수수료가 발생할 수 있어요.';
 if(/사진|이미지/.test(t))return '프로토타입에서는 사진 전송을 지원하지 않아요. 실제 앱에서는 입력창 왼쪽의 카메라 버튼으로 보낼 수 있어요 📷';
 if(/주차|엘리베이터|층/.test(t))return '주차 가능 여부와 엘리베이터 사용 가능 시간을 알려주시면 작업 동선에 반영할게요.';
 if(/안녕|문의|질문/.test(t))return '네, 말씀하세요! 어떤 서비스가 궁금하신가요?';
 return '네, 확인했습니다. 담당 매니저에게 전달하고 곧 답변드릴게요 🙂';
}

SCREENS.points=()=>`<div class="screen">${navBar({title:'청소 포인트'})}<div class="body"><div style="padding:24px"><div style="color:var(--sub)">사용 가능</div><div style="font-size:34px;font-weight:800;margin-top:6px">${S.points.toLocaleString()}P</div></div><div class="divider"></div><div class="empty">포인트 내역이 없어요.<br>후기를 작성하면 포인트를 드려요.</div></div></div>`;
SCREENS.account=()=>`<div class="screen">${navBar({title:'계정정보'})}<div class="body" style="padding:8px 24px">${[['이름',S.user.name],['휴대폰 번호',S.user.phone],['이메일',S.user.email],['로그인 방식','데모 계정']].map(([k,v])=>`<div class="row" style="border-bottom:1px solid var(--line);padding:22px 0"><span class="t" style="color:var(--sub2)">${k}</span><span>${esc(v)}</span></div>`).join('')}<p style="font-size:13px;color:var(--sub);margin-top:16px">프로토타입 샘플 계정입니다.</p></div></div>`;
SCREENS.notice=()=>`<div class="screen">${navBar({title:'공지사항'})}<div class="body" style="padding:0 24px">${[['[원룸청소] 서비스 요금 조정 안내','2026.11.01'],['에어컨 청소 성수기 예약 오픈 안내','2026.10.24'],['매트리스 · 소파 청소 서비스 오픈','2026.10.02'],['개인정보 처리방침 개정 안내','2026.09.15']].map(([t,d])=>`<button class="row" style="border-bottom:1px solid var(--line);padding:20px 0;display:block" onclick="toast('공지 상세는 데모에서 준비 중이에요')"><div style="font-size:16px">${t}</div><div style="color:var(--sub);font-size:13px;margin-top:6px">${d}</div></button>`).join('')}</div></div>`;
SCREENS.tips=()=>`<div class="screen gray">${navBar({title:'말끔 팁'})}<div class="body"><div class="card" style="margin-top:8px">${NEWS.map(n=>`<button class="news" onclick="toast('콘텐츠 상세는 데모에서 준비 중이에요')"><div class="th" style="background:${n.bg}">${n.e}</div><div><small>${n.c}</small><p>${n.t}</p></div></button>`).join('')}</div></div></div>`;
const FAQS=[['예약은 언제까지 변경할 수 있나요?','방문 2일 전까지 앱에서 직접 변경할 수 있어요. 이후에는 상담 채팅으로 문의해 주세요.'],['매니저님이 청소도구를 가져오나요?','원룸·화장실·주방 청소는 고객님 댁의 기본 청소도구를 사용해요. 이사·입주, 에어컨, 매트리스, 소파 청소는 전문 장비를 가져갑니다.'],['할인 쿠폰은 어떻게 받나요?','홈 배너의 웰컴 쿠폰팩과 이벤트 쿠폰을 받을 수 있어요. 받은 쿠폰은 결제 화면에서 바로 적용됩니다.'],['이사·입주 청소는 왜 상담이 필요한가요?','집 상태와 짐 여부에 따라 인원과 장비가 달라져서, 상담 채팅으로 견적을 확정한 뒤 진행해요.']];
SCREENS.faq=()=>`<div class="screen">${navBar({title:'자주 묻는 질문'})}<div class="body" style="padding:0 24px">${FAQS.map(([q,a],i)=>`<div class="faq"><button onclick="ui.faqOpen=ui.faqOpen===${i}?-1:${i};render()"><b style="color:var(--brand)">Q</b><span style="flex:1">${q}</span>${ic(ui.faqOpen===i?'up':'down','sm')}</button>${ui.faqOpen===i?`<p>${a}</p>`:''}</div>`).join('')}</div></div>`;
SCREENS.doc=({t})=>`<div class="screen">${navBar({title:t})}<div class="body" style="padding:24px;color:var(--sub2);line-height:1.7">${t} 본문 영역입니다. 프로토타입에서는 내용을 제공하지 않습니다.</div></div>`;

render();
</script>
</body>
</html>
