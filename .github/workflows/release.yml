name: release

# Tag vX.Y.Z or vX.Y.Z-beta.N on master -> full CI (ci.yml) + install e2e with image scan (e2e.yml) + store
# listing check -> server images on GHCR (SBOM + provenance, cosign-signed by digest) -> installer, signed
# SHA256SUMS and manifest, and the install page into the PUBLIC delivery repo (repo variable DIST_REPO, e.g.
# owner/malkkeum-install) -> GitHub Release with the same files as assets.
# Nothing is published unless ci.yml and e2e.yml pass on the tagged commit, and a tag must point into master.
# workflow_dispatch on a branch is a dry run: tests, install e2e and the listing check only.
# GitHub-hosted runners only (signing identity, deploy key and package write access never touch a
# machine anyone else uses).
#
# Environments (set in GitHub: required reviewer, deployment branches and tags = v*):
#   release-cosign   images job: GHCR push and keyless cosign signing (OIDC).
#   release-delivery delivery job: DIST_DEPLOY_KEY (push to DIST_REPO), DAHAE_MANIFEST_KEY (ed25519 PEM,
#                    signs installer_manifest.json), and the cosign OIDC identity for SHA256SUMS and the page.
#   Not in this workflow yet: the Android store build is still signed locally by scripts/release/build-all.ps1
#   (planned: a dispatch-driven job in an android-signing environment; docs/DEPLOY.md, Release environments).
#   GitHub creates a missing environment without protection rules, so set up the three above before the first tag.
#
# Channels: image tags `<version>` and `beta` on every release; `stable` and `latest` only without a
# prerelease suffix. Delivery branches: `beta` gets every release, `main` (stable) only stable ones.
# The same deploy key pushes an annotated tag v<VER> in DIST_REPO on the release's channel commit: the pinned
# install line raw.githubusercontent.com/<DIST_REPO>/v<VER>/install.sh. No token.
# Images are signed by digest with cosign keyless (this workflow's OIDC identity on refs/tags/v*);
# install.sh and `dahae update` refuse images without that signature (docs/DEPLOY.md, Image signatures).
# The signed digest is the multi-arch index, which also lists the SBOM and provenance attestations.
# scripts/release/check_workflows.py (run by release-tools.yml) keeps every action pinned to a commit SHA.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false, fetch-depth: 0 }
      # Release tags are cut from master only; a tag on a feature branch never reaches a server.
      - name: Tag is on master
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*)
              git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
                || { echo "::error::release tags must point at a commit on master"; exit 1; } ;;
          esac

  test:
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions: { contents: read }

  e2e:
    needs: guard
    uses: ./.github/workflows/e2e.yml
    permissions: { contents: read }

  # Listing length limits (docs/store/check_listings.py) and the store screenshots, when generated.
  store:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - name: Store listing lengths
        run: python3 -I docs/store/check_listings.py
      - name: Store screenshots and release notes (artifacts)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-material
          path: |
            docs/store/screenshots
            docs/store/release-notes
          if-no-files-found: warn
          retention-days: 90

  images:
    needs: [test, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release-cosign
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing: Fulcio certificate for release.yml on this tag
    strategy:
      matrix:
        include:
          - { name: malkkeum-api, context: backend, file: backend/Dockerfile }
          - { name: malkkeum-web, context: ., file: deploy/web.Dockerfile }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - name: Tags
        id: meta
        env: { NAME: "${{ matrix.name }}" }
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          ver="${GITHUB_REF_NAME#v}"
          tags="$repo/$NAME:$ver,$repo/$NAME:beta"
          case "$ver" in *-*) ;; *) tags="$tags,$repo/$NAME:stable,$repo/$NAME:latest" ;; esac
          { echo "tags=$tags"; echo "version=$ver"; } >> "$GITHUB_OUTPUT"
      # linux/arm64 on the x86 runner through QEMU.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: v3.1.4 } # same version as COSIGN_VERSION in deploy/install.sh (scripts/ci/check-pins.sh)
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          tags: ${{ steps.meta.outputs.tags }}
          # SPDX SBOM (BuildKit's syft scanner) and SLSA provenance, attached to the index.
          sbom: true
          provenance: mode=max
      # Signs the multi-arch index digest (what every tag points at), never a movable tag.
      - name: Sign by digest
        env: { NAME: "${{ matrix.name }}", DIGEST: "${{ steps.build.outputs.digest }}" }
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$NAME@$DIGEST"

  # The installer pulls without a login, so both packages must be public and carry both CPU types.
  # Runs before delivery: an installer that cannot pull its images is never published.
  pull-check:
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: v3.1.4 } # same version as COSIGN_VERSION in deploy/install.sh
      - name: Anonymous pull check (amd64 + arm64)
        run: |
          # Empty docker config = no stored login and no credential helper.
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-anon"
          rm -rf "$DOCKER_CONFIG" && mkdir -p "$DOCKER_CONFIG"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ver="${GITHUB_REF_NAME#v}"
          bad=0
          for name in malkkeum-api malkkeum-web; do
            ref="ghcr.io/$owner/$name:$ver"
            if ! manifest=$(docker manifest inspect "$ref" 2>&1); then
              echo "::error title=$name is not public::Cannot pull $ref without a login. Make the GHCR package public once: https://github.com/users/$GITHUB_REPOSITORY_OWNER/packages/container/$name/settings -> Danger Zone -> Change visibility -> Public (organisation: https://github.com/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$name/settings). Then re-run this job. Registry said: $(printf '%s' "$manifest" | tail -n 1)"
              bad=1
              continue
            fi
            for arch in amd64 arm64; do
              if ! printf '%s' "$manifest" | grep -Eq "\"architecture\": *\"$arch\""; then
                echo "::error title=$name has no linux/$arch image::$ref is public but its manifest lists no linux/$arch image. Check the images job (QEMU / platforms)."
                bad=1
              fi
            done
            [ "$bad" = 1 ] || echo "ok: $ref pulls anonymously (linux/amd64, linux/arm64)"
          done
          rm -rf "$DOCKER_CONFIG"
          exit "$bad"
      # The exact check a server runs (the dahae CLI that install.sh writes), anonymously, on this tag.
      - name: Signature check with the installer's own code
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-anon-sig"
          rm -rf "$DOCKER_CONFIG" && mkdir -p "$DOCKER_CONFIG"
          w="$RUNNER_TEMP/sigcheck"; rm -rf "$w"; mkdir -p "$w/bin"
          ln -s "$(command -v cosign)" "$w/bin/cosign"
          # shellcheck source=/dev/null
          DAHAE_SELFTEST=1 . deploy/install.sh
          export DIR=$w; write_cli "$w/dahae"; cd "$w" || exit 1
          printf 'SIGNER_REPO=%s\n' "$GITHUB_REPOSITORY" > .env
          # shellcheck source=/dev/null
          DAHAE_SELFTEST=1 . ./dahae
          for name in malkkeum-api malkkeum-web; do
            echo "ok: signed $(verify_image "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$name:${GITHUB_REF_NAME#v}")"
          done
          rm -rf "$DOCKER_CONFIG" "$w"

  delivery:
    needs: [images, pull-check, store]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-delivery
    permissions:
      contents: write # gh release create
      id-token: write # cosign keyless signature on SHA256SUMS and the install page
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: v3.1.4 } # same version as COSIGN_VERSION in deploy/install.sh
      # The ed25519 key only signs; it stays in a temp file that is removed at the end.
      - name: Installer manifest key
        env: { MANIFEST_KEY: "${{ secrets.DAHAE_MANIFEST_KEY }}" }
        run: |
          test -n "$MANIFEST_KEY" || { echo "::error::DAHAE_MANIFEST_KEY is not set in the release-delivery environment"; exit 1; }
          d="$RUNNER_TEMP/sign"; mkdir -p "$d" && chmod 700 "$d"
          (umask 077; printf '%s\n' "$MANIFEST_KEY" > "$d/manifest.pem")
          echo "MANIFEST_KEY_FILE=$d/manifest.pem" >> "$GITHUB_ENV"
      # Key and known_hosts live in the job's temp dir only, never in ~/.ssh.
      - name: Deploy key and GitHub host key (fingerprint checked)
        env: { DIST_DEPLOY_KEY: "${{ secrets.DIST_DEPLOY_KEY }}" }
        run: |
          d="$RUNNER_TEMP/ssh"; mkdir -p "$d" && chmod 700 "$d"
          ssh-keyscan -t ed25519 github.com > "$d/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known_hosts" | awk '{print $2}')" = "SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU"
          (umask 077; printf '%s\n' "$DIST_DEPLOY_KEY" > "$d/key")
          echo "GIT_SSH_COMMAND=ssh -i $d/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$d/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
      - name: Publish installer, signed files and install page
        env:
          DIST_REPO: ${{ vars.DIST_REPO }}
          VER: ${{ github.ref_name }}
          ASSET_DIR: ${{ runner.temp }}/assets
          SIGN_RELEASE: "1"
        # Branches beta/main + annotated tag v<VER> with install.sh, SHA256SUMS and manifest (deploy key only).
        run: IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" SIGNER_REPO="$GITHUB_REPOSITORY" bash deploy/publish-delivery.sh
      - name: Release notes and assets in this repo
        env: { GH_TOKEN: "${{ github.token }}", VER: "${{ github.ref_name }}", ASSET_DIR: "${{ runner.temp }}/assets" }
        run: |
          flags=()
          case "$VER" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$VER" --repo "$GITHUB_REPOSITORY" --title "$VER" --generate-notes "${flags[@]}" "$ASSET_DIR"/*
      - name: Remove deploy and manifest keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/sign"
