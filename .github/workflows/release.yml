name: release

# Tag vX.Y.Z (or run by hand) -> server images on GHCR + install.sh attached to a GitHub release.
# The installer is published with this repository's image location baked in, so the person
# installing only runs:
#   curl -fsSL https://github.com/<owner>/<repo>/releases/latest/download/install.sh | sudo bash
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: malkkeum-api, context: backend, file: backend/Dockerfile }
          - { name: malkkeum-web, context: ., file: deploy/web.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          tags: |
            ${{ steps.meta.outputs.repo }}/${{ matrix.name }}:latest
            ${{ steps.meta.outputs.repo }}/${{ matrix.name }}:${{ steps.meta.outputs.version }}

  installer:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          sed "s|IMAGE_REPO=\"\${MALKKEUM_IMAGES:-ghcr.io/malkkeum}\"|IMAGE_REPO=\"\${MALKKEUM_IMAGES:-$repo}\"|" deploy/install.sh > install.sh
          grep -q "$repo" install.sh
          bash -n install.sh
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: install.sh
          generate_release_notes: true
