name: release

# Tag vX.Y.Z or vX.Y.Z-beta.N -> install test -> server images on GHCR -> installer + guides into the
# PUBLIC delivery repo (repo variable DIST_REPO, e.g. owner/malkkeum-install) -> GitHub Release notes
# in this private repo. Nothing is published unless the full CI suite passes (install e2e is manual: e2e.yml).
#
# Channels: image tags `<version>` and `beta` on every release; `stable` and `latest` only without a
# prerelease suffix. Delivery branches: `beta` gets every release, `main` (stable) only stable ones.
# Secret DIST_DEPLOY_KEY: SSH private key with write access to DIST_REPO (deploy key).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  images:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, malkkeum]
    strategy:
      matrix:
        include:
          - { name: malkkeum-api, context: backend, file: backend/Dockerfile }
          - { name: malkkeum-web, context: ., file: deploy/web.Dockerfile }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tags
        id: meta
        env: { NAME: "${{ matrix.name }}" }
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          ver="${GITHUB_REF_NAME#v}"
          tags="$repo/$NAME:$ver,$repo/$NAME:beta"
          case "$ver" in *-*) ;; *) tags="$tags,$repo/$NAME:stable,$repo/$NAME:latest" ;; esac
          { echo "tags=$tags"; echo "version=$ver"; } >> "$GITHUB_OUTPUT"
      # linux/arm64 on the x86 self-hosted runner: registers the QEMU binfmt handler (needs privileged docker).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          tags: ${{ steps.meta.outputs.tags }}

  # The installer pulls without a login, so both packages must be public and carry both CPU types.
  # Runs before delivery: an installer that cannot pull its images is never published.
  pull-check:
    needs: images
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, malkkeum]
    steps:
      - name: Anonymous pull check (amd64 + arm64)
        run: |
          # Empty docker config = no stored login and no credential helper; the runner's own config is untouched.
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-anon"
          rm -rf "$DOCKER_CONFIG" && mkdir -p "$DOCKER_CONFIG"
          docker logout ghcr.io >/dev/null 2>&1 || true
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ver="${GITHUB_REF_NAME#v}"
          bad=0
          for name in malkkeum-api malkkeum-web; do
            ref="ghcr.io/$owner/$name:$ver"
            if ! manifest=$(docker manifest inspect "$ref" 2>&1); then
              echo "::error title=$name is not public::Cannot pull $ref without a login. Make the GHCR package public once: https://github.com/users/$GITHUB_REPOSITORY_OWNER/packages/container/$name/settings -> Danger Zone -> Change visibility -> Public (organisation: https://github.com/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/$name/settings). Then re-run this job. Registry said: $(printf '%s' "$manifest" | tail -n 1)"
              bad=1
              continue
            fi
            for arch in amd64 arm64; do
              if ! printf '%s' "$manifest" | grep -Eq "\"architecture\": *\"$arch\""; then
                echo "::error title=$name has no linux/$arch image::$ref is public but its manifest lists no linux/$arch image. Check the images job (QEMU / platforms)."
                bad=1
              fi
            done
            [ "$bad" = 1 ] || echo "ok: $ref pulls anonymously (linux/amd64, linux/arm64)"
          done
          rm -rf "$DOCKER_CONFIG"
          exit "$bad"

  delivery:
    needs: [images, pull-check]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, malkkeum]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Self-hosted runner: key and known_hosts live in the job's temp dir, never in the runner user's ~/.ssh.
      - name: Deploy key and GitHub host key (fingerprint checked)
        env: { DIST_DEPLOY_KEY: "${{ secrets.DIST_DEPLOY_KEY }}" }
        run: |
          d="$RUNNER_TEMP/ssh"; mkdir -p "$d" && chmod 700 "$d"
          ssh-keyscan -t ed25519 github.com > "$d/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$d/known_hosts" | awk '{print $2}')" = "SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU"
          (umask 077; printf '%s\n' "$DIST_DEPLOY_KEY" > "$d/key")
          echo "GIT_SSH_COMMAND=ssh -i $d/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$d/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
      - name: Publish installer and guides
        env:
          DIST_REPO: ${{ vars.DIST_REPO }}
          VER: ${{ github.ref_name }}
        run: IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" bash deploy/publish-delivery.sh
      - name: Release notes in this (private) repo
        env: { GH_TOKEN: "${{ github.token }}", VER: "${{ github.ref_name }}" }
        run: |
          flags=()
          case "$VER" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$VER" --title "$VER" --generate-notes "${flags[@]}"
      - name: Remove deploy key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
