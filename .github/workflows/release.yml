name: release

# Tag vX.Y.Z (or run by hand) -> server images on GHCR + a release in the PUBLIC delivery repo
# (repo variable DIST_REPO, e.g. owner/malkkeum-install; secret DIST_TOKEN with write access to it).
# The delivery repo holds only install.sh and the Korean guides — never source. The installer is
# published with this repository's image location baked in, so the person installing only runs:
#   curl -fsSL https://github.com/<DIST_REPO>/releases/latest/download/install.sh | sudo bash
# One-time: make the two GHCR packages public (Package settings -> Change visibility).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: malkkeum-api, context: backend, file: backend/Dockerfile }
          - { name: malkkeum-web, context: ., file: deploy/web.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          tags: |
            ${{ steps.meta.outputs.repo }}/${{ matrix.name }}:latest
            ${{ steps.meta.outputs.repo }}/${{ matrix.name }}:${{ steps.meta.outputs.version }}

  installer:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          sed "s|IMAGE_REPO=\"\${MALKKEUM_IMAGES:-ghcr.io/malkkeum}\"|IMAGE_REPO=\"\${MALKKEUM_IMAGES:-$repo}\"|" deploy/install.sh > install.sh
          grep -q "$repo" install.sh
          bash -n install.sh
      - name: Guides into the delivery repo
        env: { DIST_REPO: "${{ vars.DIST_REPO }}", DIST_TOKEN: "${{ secrets.DIST_TOKEN }}" }
        run: |
          test -n "$DIST_REPO" && test -n "$DIST_TOKEN" || { echo "::error::set variable DIST_REPO and secret DIST_TOKEN"; exit 1; }
          git clone -q "https://x-access-token:${DIST_TOKEN}@github.com/${DIST_REPO}.git" dist
          rm -rf dist/guide dist/store && cp -r docs/guide docs/store dist/
          url="https://github.com/${DIST_REPO}/releases/latest/download/install.sh"
          sed -i "s|https://github.com/<계정>/<저장소>/releases/latest/download/install.sh|$url|" dist/guide/01-*.md
          cp docs/delivery-README.md dist/README.md
          sed -i "s|INSTALL_URL|$url|" dist/README.md
          cd dist && git add -A
          git diff --cached --quiet || { git -c user.name=release -c user.email=release@users.noreply.github.com commit -qm "guides ${GITHUB_REF_NAME}" && git push -q; }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repository: ${{ vars.DIST_REPO }}
          token: ${{ secrets.DIST_TOKEN }}
          files: install.sh
          body: "설치 명령: curl -fsSL https://github.com/${{ vars.DIST_REPO }}/releases/latest/download/install.sh | sudo bash"

