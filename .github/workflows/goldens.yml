name: goldens

# Makes golden (pixel) baselines on the same runner image and Flutter version that ci.yml compares on.
# Run from the Actions tab on a branch, download the "goldens" artifact, unpack it over app/ (it keeps the
# app/... paths), review the PNGs and commit them. From then on ci.yml fails on any pixel change or
# missing baseline (scripts/ci/goldens.sh). Re-run after an intended visual change or a Flutter bump.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: ./.github/actions/flutter-setup
      - run: bash scripts/ci/goldens.sh update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goldens
          path: app/**/test/**/goldens/**/*.png
          if-no-files-found: error
          retention-days: 14
