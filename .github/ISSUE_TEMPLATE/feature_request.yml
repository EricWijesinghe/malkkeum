name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [Customer app, Partner app, Owner console, API / server, Installer / dahae CLI, Website]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and for whom (customer, partner, owner)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
