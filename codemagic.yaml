# Cloud builds for the store apps (no Mac needed). Set up once in the Codemagic web UI:
#   1. Teams → Integrations → App Store Connect: add an API key named "malkkeum_asc".
#   2. Code signing → Android keystores: upload the upload keystore with reference "malkkeum_upload".
#   3. Environment variables → group "malkkeum" (every key except API_BASE is optional; a missing
#      key only hides that sign-in button / disables push). Full list + where to get each: DEPLOY.md §3
#        API_BASE                     https://<client domain>          (the server the apps talk to)
#        GCLOUD_SERVICE_ACCOUNT_CREDENTIALS  Google Play service-account JSON (secure)
#        KAKAO_NATIVE_KEY, NAVER_CLIENT_ID, NAVER_CLIENT_SECRET, NAVER_CLIENT_NAME,
#        GOOGLE_SERVER_CLIENT_ID, GOOGLE_IOS_CLIENT_ID, SOCIAL_PROVIDERS (optional override)
#        APP_LINK_DOMAIN                  bare server host, e.g. malkkeum.co.kr (Naver App Link; no host = no Naver button)
#        GOOGLE_SERVICES_JSON_B64 / GOOGLE_SERVICE_INFO_PLIST_B64          (customer Firebase, base64)
#        PARTNER_GOOGLE_SERVICES_JSON_B64 / PARTNER_GOOGLE_SERVICE_INFO_PLIST_B64 (partner Firebase)
#   4. Start "customer-ios", "customer-android", "partner-ios", "partner-android" on a tag v1.2.3.
# Run by the developer on the private repo, never by the client. Runbook: docs/DEPLOY.md §3
#
# Secrets: none in this file or the repo. The keystore, the App Store Connect key and the group
# "malkkeum" live in Codemagic (mark every value there as secure); iOS certificates and profiles are
# fetched with the App Store Connect key at build time (ios_signing below).
#
# Where a build goes:
#   Android: uploaded to the Play internal track as a draft. Promote it in Play Console.
#   iOS:     uploaded to App Store Connect with the "malkkeum_asc" key (role App Manager) and sent to
#            TestFlight internal testers after Apple's processing (10-30 min). Nothing is sent to
#            App Review from here: in App Store Connect add the build to the version, attach
#            docs/store/review-notes.md and press "Submit for Review".
#
# Build numbers come from scripts/ci/build-number.py, the same source as the PC release script
# (scripts/release/build-all.ps1), so a number is never reused whichever machine built the upload.
#
# Builds are obfuscated. The Dart symbol files (build/symbols) and iOS dSYMs are kept as build
# artifacts only, never inside the app: download them from the build page to read a crash trace
# (flutter symbolize -i trace.txt -d app.android-arm64.symbols).

definitions:
  prepare: &prepare
    name: Strings and packages
    script: |
      # Version name comes from the git tag (v1.2.3). No tag: pubspec version is used.
      if [ -n "$FCI_TAG" ] && ! echo "$FCI_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "Tag '$FCI_TAG' must look like v1.2.3"; exit 1
      fi
      cd app
      python3 -I ../scripts/ci/check-native.py
      python3 -I tool/gen_arb.py
      flutter pub get
      (cd packages/core && flutter gen-l10n)
  env: &env
    # Pinned so a store build is reproducible: same Flutter as deploy/web.Dockerfile. Raise both together.
    flutter: 3.47.9
    xcode: 26.6
    groups: [malkkeum]

workflows:
  customer-android:
    name: Customer · Google Play
    max_build_duration: 60
    environment:
      <<: *env
      android_signing: [malkkeum_upload]
    scripts:
      - *prepare
      - name: Build app bundle
        working_directory: app/apps/customer
        script: |
          set -euo pipefail
          ../../../scripts/ci/native-keys.sh customer
          build_number=$(python3 -I ../../../scripts/ci/build-number.py)
          flutter build appbundle --release --build-number=$build_number ${FCI_TAG:+--build-name=${FCI_TAG#v}} --obfuscate --split-debug-info=build/symbols --dart-define-from-file=keys.json
    artifacts:
      - app/apps/customer/build/**/outputs/**/*.aab
      - app/apps/customer/build/**/outputs/**/mapping.txt
      - app/apps/customer/build/symbols/*.symbols
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  customer-ios:
    name: Customer · App Store
    max_build_duration: 90
    integrations: { app_store_connect: malkkeum_asc }
    environment:
      <<: *env
      ios_signing: { distribution_type: app_store, bundle_identifier: com.malkkeum.customer }
    scripts:
      - *prepare
      - name: Signing profiles
        script: xcode-project use-profiles
      - name: Build ipa
        working_directory: app/apps/customer
        script: |
          set -euo pipefail
          ../../../scripts/ci/native-keys.sh customer
          build_number=$(python3 -I ../../../scripts/ci/build-number.py)
          flutter build ipa --release --build-number=$build_number ${FCI_TAG:+--build-name=${FCI_TAG#v}} --obfuscate --split-debug-info=build/symbols --dart-define-from-file=keys.json --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - app/apps/customer/build/ios/ipa/*.ipa
      - app/apps/customer/build/ios/archive/**/*.dSYM
      - app/apps/customer/build/symbols/*.symbols
    publishing:
      app_store_connect: { auth: integration, submit_to_testflight: true, submit_to_app_store: false }

  partner-android:
    name: Partner · Google Play
    max_build_duration: 60
    environment:
      <<: *env
      android_signing: [malkkeum_upload]
    scripts:
      - *prepare
      - name: Build app bundle
        working_directory: app/apps/partner
        script: |
          set -euo pipefail
          ../../../scripts/ci/native-keys.sh partner
          build_number=$(python3 -I ../../../scripts/ci/build-number.py)
          flutter build appbundle --release --build-number=$build_number ${FCI_TAG:+--build-name=${FCI_TAG#v}} --obfuscate --split-debug-info=build/symbols --dart-define-from-file=keys.json
    artifacts:
      - app/apps/partner/build/**/outputs/**/*.aab
      - app/apps/partner/build/**/outputs/**/mapping.txt
      - app/apps/partner/build/symbols/*.symbols
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  partner-ios:
    name: Partner · App Store
    max_build_duration: 90
    integrations: { app_store_connect: malkkeum_asc }
    environment:
      <<: *env
      ios_signing: { distribution_type: app_store, bundle_identifier: com.malkkeum.partner }
    scripts:
      - *prepare
      - name: Signing profiles
        script: xcode-project use-profiles
      - name: Build ipa
        working_directory: app/apps/partner
        script: |
          set -euo pipefail
          ../../../scripts/ci/native-keys.sh partner
          build_number=$(python3 -I ../../../scripts/ci/build-number.py)
          flutter build ipa --release --build-number=$build_number ${FCI_TAG:+--build-name=${FCI_TAG#v}} --obfuscate --split-debug-info=build/symbols --dart-define-from-file=keys.json --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - app/apps/partner/build/ios/ipa/*.ipa
      - app/apps/partner/build/ios/archive/**/*.dSYM
      - app/apps/partner/build/symbols/*.symbols
    publishing:
      app_store_connect: { auth: integration, submit_to_testflight: true, submit_to_app_store: false }
