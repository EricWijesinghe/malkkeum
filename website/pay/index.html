<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>결제</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B1022; color: #F3F5FF;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .box { text-align: center; padding: 24px; }
    .spin { width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 50%; border: 4px solid rgba(255,255,255,.15); border-top-color: #3B5BFD; animation: r 1s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
  <!-- PortOne V2 browser SDK (official CDN). -->
  <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
</head>
<body>
  <div class="box"><div class="spin" aria-hidden="true"></div><p id="msg">결제창을 여는 중…</p></div>
  <script>
    // Opened by the app in a WebView: /pay/?checkout=..&store=..&channel=..&amount=..&method=..&name=..
    // paymentId MUST be the checkout id: the server's webhook and recovery pass look payments up by it.
    (function () {
      var q = new URLSearchParams(location.search);
      var id = q.get('checkout');
      // Web app (/app/) opened this page in its own tab: remember where to resume, read by done.html.
      var back = q.get('back');
      if (back && back.indexOf('/app/') === 0) { try { sessionStorage.setItem('mk.payBack', back); } catch (e) { /* private mode */ } }
      var done = function (extra) {
        var p = new URLSearchParams(Object.assign({ paymentId: id || '' }, extra || {}));
        location.replace('/pay/done.html?' + p.toString());
      };
      if (!id || !window.PortOne) return done({ code: 'SDK_UNAVAILABLE' });
      var method = q.get('method') || 'card';
      var easy = { kakaopay: 'KAKAOPAY', naverpay: 'NAVERPAY', tosspay: 'TOSSPAY', payco: 'PAYCO', samsungpay: 'SAMSUNGPAY', applepay: 'APPLEPAY' };
      var payMethod = easy[method] ? 'EASY_PAY'
        : ({ card: 'CARD', transfer: 'TRANSFER', virtual_account: 'VIRTUAL_ACCOUNT', phone: 'MOBILE' })[method] || 'CARD';
      var req = {
        storeId: q.get('store'),
        channelKey: q.get('channel'),
        paymentId: id,
        orderName: q.get('name') || '청소 예약',
        totalAmount: Number(q.get('amount')),
        currency: 'CURRENCY_KRW',
        payMethod: payMethod,
        customData: JSON.stringify({ checkoutId: id }),
        redirectUrl: location.origin + '/pay/done.html',
        locale: 'KO_KR',
      };
      if (easy[method]) req.easyPay = { easyPayProvider: easy[method] };
      if (payMethod === 'VIRTUAL_ACCOUNT') req.virtualAccount = { accountExpiry: { validHours: 24 } };
      if (payMethod === 'MOBILE') req.productType = 'PRODUCT_TYPE_REAL';
      var phone = q.get('phone');
      if (phone) req.customer = { phoneNumber: phone };
      PortOne.requestPayment(req)
        .then(function (r) { done(r && r.code ? { code: r.code, message: r.message || '' } : {}); })
        .catch(function (e) { done({ code: 'SDK_ERROR', message: String(e && e.message || e) }); });
    })();
  </script>
</body>
</html>
