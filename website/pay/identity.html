<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>본인인증</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B1217; color: #EEF4F7;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .box { text-align: center; padding: 24px; }
    .spin { width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 50%; border: 4px solid rgba(255,255,255,.15); border-top-color: #1E9EBA; animation: r 1s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
  <!-- PortOne V2 browser SDK (official CDN). -->
  <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
</head>
<body>
  <div class="box"><div class="spin" aria-hidden="true"></div><p id="msg">본인인증창을 여는 중…</p></div>
  <script>
    // Sources: https://developers.portone.io/sdk/ko/v2-sdk/identity-verification-request (storeId,
    // identityVerificationId, channelKey, customer, redirectUrl) and
    // https://developers.portone.io/sdk/ko/v2-sdk/identity-verification-response (success: identityVerificationId;
    // failure: code, message). Opened by the app in a WebView:
    // /pay/identity.html?store=..&channel=..&id=..
    // The id was issued by the API for this customer; the app reads it back from the done address and the
    // API checks it with PortOne. Nothing identity-related is kept here.
    (function () {
      var q = new URLSearchParams(location.search);
      var id = q.get('id') || '';
      var done = function (extra) {
        var p = new URLSearchParams(Object.assign({}, extra || {}));
        location.replace('/pay/identity-done.html?' + p.toString());
      };
      if (!id || !q.get('store') || !q.get('channel')) return done({ code: 'BAD_REQUEST' });
      if (!window.PortOne) return done({ code: 'SDK_UNAVAILABLE' });
      PortOne.requestIdentityVerification({
        storeId: q.get('store'),
        identityVerificationId: id,
        channelKey: q.get('channel'),
        redirectUrl: location.origin + '/pay/identity-done.html',
      })
        .then(function (r) { done(r && r.identityVerificationId ? { identityVerificationId: r.identityVerificationId } : { code: (r && r.code) || 'NO_ID', message: (r && r.message) || '' }); })
        .catch(function (e) { done({ code: 'SDK_ERROR', message: String(e && e.message || e) }); });
    })();
  </script>
</body>
</html>
