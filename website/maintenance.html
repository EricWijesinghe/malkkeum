<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>점검 중이에요 · We are under maintenance</title>
  <style>
    :root { color-scheme: light dark; --bg: #faf9f7; --fg: #1d1b19; --muted: #5f5a54; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161513; --fg: #f2efe9; --muted: #aaa39a; }
    }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Noto Sans KR", sans-serif;
    }
    main { max-width: 32rem; padding: 2rem 1.5rem; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
    p { margin: .5rem 0; line-height: 1.6; color: var(--muted); }
    .en { font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>점검 중이에요</h1>
    <p>더 나은 서비스를 위해 점검하고 있어요. 잠시 후 다시 열어 주세요.</p>
    <p class="en">We are improving the service. Please come back shortly.</p>
  </main>
</body>
</html>
