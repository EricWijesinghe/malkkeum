# Production stack on one server: Postgres + API + web (Caddy: website, console, automatic HTTPS).
# Installed and managed by deploy/install.sh — nobody needs to edit this file.
# Images are prebuilt by .github/workflows/release.yml; `malkkeum update` pulls new ones.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: cleaning
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app -d cleaning"], interval: 5s, retries: 20 }

  api:
    image: ${API_IMAGE:-${IMAGE_REPO:-ghcr.io/malkkeum}/malkkeum-api:${VERSION:-stable}}
    build: { context: ../backend }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/cleaning
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DATA_KEY: ${DATA_KEY:?set DATA_KEY}
      SETUP_CODE: ${SETUP_CODE:-}
      PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN}
      ALLOWED_ORIGINS: https://${DOMAIN}
      TRUSTED_PROXY: "1"
      DEV_MODE: "0"
      RUST_LOG: info,sqlx=warn
      # App Links for Naver login (/.well-known/*). Set in .env; empty = not served.
      ANDROID_CERT_SHA256: "${ANDROID_CERT_SHA256:-}"
      APPLE_TEAM_ID: "${APPLE_TEAM_ID:-}"
    volumes: [uploads:/data/uploads]
    healthcheck: { test: ["CMD", "api", "--health"], interval: 15s, retries: 10, start_period: 20s }

  web:
    image: ${WEB_IMAGE:-${IMAGE_REPO:-ghcr.io/malkkeum}/malkkeum-web:${VERSION:-stable}}
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes: [caddydata:/data, caddyconfig:/config]

volumes: { dbdata: {}, uploads: {}, caddydata: {}, caddyconfig: {} }
