name: customer
description: customer app
publish_to: none
version: 1.0.0+1
resolution: workspace
environment:
  sdk: ^3.9.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ui:
  core:
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  intl: ^0.20.3
  geolocator: ^14.0.1
  geocoding: ^5.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test_support:

flutter:
  uses-material-design: true

# Windows MSIX, built by scripts/store/build-msix.ps1 (msix:create CLI flags override these).
# identity/publisher below are placeholders: real Partner Center values come from scripts/store/msix.local.psd1 or env.
msix_config:
  display_name: 다해
  publisher_display_name: Dahae
  identity_name: com.malkkeum.customer
  publisher: CN=Malkkeum Test
  logo_path: ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
  msix_version: 1.0.0.0
  capabilities: internetClient
  languages: en-us, fil-ph, id-id, ja-jp, km-kh, ko-kr, mn-mn, ne-np, ru-ru, si-lk, th-th, uz-latn-uz, vi-vn, zh-cn
  store: false
