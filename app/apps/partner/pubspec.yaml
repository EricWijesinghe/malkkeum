name: partner
description: partner app
publish_to: none
version: 1.0.0+1
resolution: workspace
environment:
  sdk: ^3.9.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ui:
  core:
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  intl: ^0.20.3
  fl_chart: ^1.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test_support:

flutter:
  uses-material-design: true

# Windows MSIX, built by scripts/store/build-msix.ps1 (msix:create CLI flags override these).
# identity/publisher below are placeholders: real Partner Center values come from scripts/store/msix.local.psd1 or env.
msix_config:
  display_name: 말끔 파트너
  publisher_display_name: Malkkeum Test
  identity_name: com.malkkeum.partner
  publisher: CN=Malkkeum Test
  logo_path: ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
  msix_version: 1.0.0.0 # placeholder: build-msix.ps1 passes a rising --version on every build
  capabilities: internetClient
  languages: en-us, fil-ph, id-id, ja-jp, km-kh, ko-kr, mn-mn, ne-np, ru-ru, si-lk, th-th, uz-latn-uz, vi-vn, zh-cn
  store: false
