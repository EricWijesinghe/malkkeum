name: ui
description: Design system — tokens, theme, components. Brand lives in BrandConfig.
publish_to: none
version: 0.1.0
resolution: workspace
environment:
  sdk: ^3.9.0
dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  intl: ^0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
