name: ui
description: Design system — tokens, theme, components. Brand lives in BrandConfig.
publish_to: none
version: 0.1.0
resolution: workspace
environment:
  sdk: ^3.9.0
dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  intl: ^0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  # 3D icon art by id: <id>.webp (1x main, required) + 2.0x/ and 3.0x/ variants (DAHAE-PLAN §4).
  assets:
    - assets/icons3d/
  fonts:
    - family: Dahae Sans
      fonts:
        - asset: assets/fonts/DahaeSans-Regular.otf
          weight: 400
        - asset: assets/fonts/DahaeSans-Medium.otf
          weight: 500
        - asset: assets/fonts/DahaeSans-SemiBold.otf
          weight: 600
        - asset: assets/fonts/DahaeSans-Bold.otf
          weight: 700
        - asset: assets/fonts/DahaeSans-ExtraBold.otf
          weight: 800
    # Rare Hangul syllables the 5 subset faces above lack (see app/tool/font_subset.py).
    - family: Dahae Sans Full
      fonts:
        - asset: assets/fonts/full/DahaeSansFull-Regular.otf
