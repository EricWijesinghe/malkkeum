# Goldens compare pixels against baselines made on the CI runner (fonts and renderer pinned there),
# so a local `flutter test` skips them. CI runs them with `flutter test --run-skipped --tags golden`.
tags:
  golden:
    skip: "golden: compared only on the CI runner (flutter test --run-skipped --tags golden)"
  # Store images, generated by scripts/store/generate.sh; excluded from CI with --exclude-tags.
  store_screenshots:
